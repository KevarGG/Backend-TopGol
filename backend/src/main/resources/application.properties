spring.application.name=topgol-store

server.port=8080

# ---------------------------------------------------------------
# Base de datos PostgreSQL
# Para tu computador: cambia TU_CLAVE_AQUI por la clave que pusiste al instalar PostgreSQL.
# Para produccion (internet): no escribas la clave aqui, define las variables de entorno
# DB_URL, DB_USER y DB_PASSWORD en el servidor.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/topgol}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# update = crea las tablas si no existen y conserva los datos que ya hay
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# El catalogo lo carga DataSeeder.java una sola vez (solo si la tabla de productos esta vacia)
spring.sql.init.mode=never
